# Hanya PostgreSQL untuk pengembangan lokal (API & web dijalankan dengan pnpm):
#   docker compose -f docker-compose.dev.yml up -d
name: portfolio-dev

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro # membuat database portfolio_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      retries: 10

volumes:
  pgdata-dev:
